{# base.html을 물려받아요 → 404 화면에도 메뉴와 바닥 글씨가 그대로 나와요 #}
{% extends "base.html" %}

{# 탭 제목 칸 채우기 #}
{% block title %}찾는 페이지가 없어요 · 클래스로 마켓{% endblock %}

{# 본문 칸 채우기 #}
{% block content %}
  <div class="not-found">
    <h1>찾는 페이지가 없어요</h1>
    <p>주소가 바뀌었거나 없어진 클래스일 수 있어요.</p>
    <p><a class="btn" href="{{ url_for('class_list') }}">클래스 목록으로 가기</a></p>
  </div>
{% endblock %}
